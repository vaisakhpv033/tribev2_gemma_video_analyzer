version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: video_creative_analyzer_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: video_creative_analyzer_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery_worker:
    build: .
    container_name: video_creative_analyzer_celery_worker
    command: >
      celery -A video_creative_analyzer worker
      --loglevel=info
      --queues=default
      --concurrency=2
    env_file: .env
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
    volumes:
      - media_data:/app/media

  celery_beat:
    build: .
    container_name: video_creative_analyzer_celery_beat
    command: >
      celery -A video_creative_analyzer beat
      --loglevel=info
      --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  media_data:
