
services:
  db:
    image: postgres:15-alpine
    container_name: video_creative_analyzer_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Ensures Postgres is ready to accept connections before web/workers boot
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: video_creative_analyzer_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:

      # Ensures Redis is ready
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build: .
    container_name: video_creative_analyzer_web
    # Run migrations and collect static files before launching Gunicorn
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --forwarded-allow-ips=\"*\" --access-logfile - video_creative_analyzer.wsgi:application"

    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    restart: always
    ports:
      # Map container port 8000 to a customizable host port (default: 8020) to avoid conflicts
      - "${BACKEND_PORT:-8020}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Bind-mount directories to the host so host Nginx can serve static and media files directly
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media

  celery_worker:
    build: .
    container_name: video_creative_analyzer_celery_worker
    command: celery -A video_creative_analyzer worker --loglevel=info --concurrency=2

    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Celery worker needs access to media folder to process videos and save outputs
      - ./media:/app/media

  celery_beat:
    build: .
    container_name: video_creative_analyzer_celery_beat
    # Start Celery Beat with standard default scheduler
    command: celery -A video_creative_analyzer beat --loglevel=info
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

