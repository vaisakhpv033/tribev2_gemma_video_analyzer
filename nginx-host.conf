# =============================================================================
# Host OS Nginx Configuration Template — Video Creative Analyzer
# =============================================================================
# Save this file to `/etc/nginx/sites-available/video-creative-analyzer.conf`
# Symlink it to enabled: `ln -s /etc/nginx/sites-available/video-creative-analyzer.conf /etc/nginx/sites-enabled/`
# Test configuration: `nginx -t`
# Reload Nginx: `systemctl reload nginx`
# =============================================================================

server {
    listen 80;
    server_name api.yourdomain.com; # <-- Replace with your subdomain or server IP

    # Increase maximum request body size to allow video uploads (e.g., 500MB)
    client_max_body_size 500M;

    # Nginx access and error logs
    access_log /var/log/nginx/video_creative_analyzer.access.log;
    error_log /var/log/nginx/video_creative_analyzer.error.log warn;

    # Gzip settings for performance optimization
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # -------------------------------------------------------------------------
    # Static Files Configuration
    # -------------------------------------------------------------------------
    # Serves collected Django static files directly from the host folder.
    location /static/ {
        alias /home/vaisakhpv033/tribev2_gemma_video_analyzer/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Media Files Configuration
    # -------------------------------------------------------------------------
    # Serves user uploaded video files and processed .npz files directly from the host folder.
    location /media/ {
        alias /home/vaisakhpv033/tribev2_gemma_video_analyzer/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Ignore common requests
    location = /favicon.ico { access_log off; log_not_found off; }

    # -------------------------------------------------------------------------
    # Backend reverse proxy mapping to the docker web container
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8020; # <-- Matches BACKEND_PORT in .env (Gunicorn in Docker)
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Preserve headers so Django knows the real client details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase proxy timeouts for long running video upload connections
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
